# Independent check of the MsQuic CUBIC AimdAccumulator underflow.
#
# Runs entirely on GitHub's servers: clones microsoft/msquic directly from
# GitHub, adds our two reproducer tests, shows that they fail and that gdb
# catches the wrap inside upstream's own tests, then applies the proposed
# change (two lines swapped) and shows that everything passes. The job log and
# the uploaded artifact are produced and hosted by GitHub, not by us.
#
# Two upstream commits are checked: the one the report was written against
# (3c9ec01c1) and whatever `main` is when the workflow runs.
name: AIMD accumulator proof

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/aimd-proof.yml"
      - "experiments/acc_proof/**"

permissions:
  contents: read

jobs:
  proof:
    name: upstream ${{ matrix.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ref: [3c9ec01c1, main]
    steps:
      - name: Check out this repository (scripts, tests, diffs only)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake build-essential gdb perl libnuma-dev

      - name: Clone upstream microsoft/msquic from GitHub
        run: |
          git clone --filter=blob:none https://github.com/microsoft/msquic.git upstream-msquic
          cd upstream-msquic
          git checkout --detach "${{ matrix.ref }}"
          git submodule update --init submodules/clog submodules/quictls submodules/googletest
          git log -1 --format='upstream commit %H  %cd  %s'
          git remote -v

      - name: Run the proof
        run: |
          experiments/acc_proof/ci_proof.sh upstream-msquic proof-logs
          cat proof-logs/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Add partial summary if a step failed
        if: failure()
        run: |
          [ -f proof-logs/summary.md ] && cat proof-logs/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aimd-proof-logs-${{ matrix.ref }}
          path: proof-logs/
          retention-days: 90
